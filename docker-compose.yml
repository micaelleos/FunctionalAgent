# Ambiente local completo: `make dev` (F01-RF-01).
services:
  emulators:
    build: ./infra/emulators
    volumes:
      - ./firebase.json:/workspace/firebase.json:ro
      - ./firestore.rules:/workspace/firestore.rules:ro
      - ./firestore.indexes.json:/workspace/firestore.indexes.json:ro
    ports:
      - "4000:4000"   # UI dos emuladores
      - "9099:9099"   # Auth
      - "8081:8081"   # Firestore

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: local
    environment:
      ENV: local
      PORT: "8000"
      CORS_ORIGINS: '["http://localhost:5173"]'
      GCP_PROJECT: demo-functional-agent
      FIRESTORE_EMULATOR_HOST: emulators:8081
      FIREBASE_AUTH_EMULATOR_HOST: emulators:9099
      # Sem credenciais do GCP no container: o modelo de eco responde o chat (E2E da F08 no CI).
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      # Limites de uso (F11): o E2E da cota usa 3; o teste de carga sobe os dois.
      DAILY_MESSAGE_QUOTA: ${DAILY_MESSAGE_QUOTA:-20}
      DAILY_TOKEN_QUOTA: ${DAILY_TOKEN_QUOTA:-200000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      # Documentação do projeto no Confluence (F19): ligada no ambiente local.
      CONFLUENCE_ENABLED: ${CONFLUENCE_ENABLED:-true}
      CONFLUENCE_WRITE_ENABLED: ${CONFLUENCE_WRITE_ENABLED:-true}
      PROMPT_VERSION: ${PROMPT_VERSION:-v2}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    depends_on:
      - emulators

  frontend:
    image: node:22-slim
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      # `VITE_DEMO_DATA=true make dev` preenche as telas com dados de demonstração (F08-RT-08).
      VITE_DEMO_DATA: ${VITE_DEMO_DATA:-false}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
