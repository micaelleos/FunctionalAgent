# Terraform do SpecFlow AI (F02-RT-01; infra/terraform).
# Em todo PR: fmt/validate/tflint, sem credenciais.
# Em master: plan + apply, depois de aprovação no GitHub Environment "infra-prd" (revisores);
# o plano aparece no log e no resumo do job antes do apply.
# O job com credenciais só roda quando INFRA_ENABLED = "true" (após o bootstrap).
name: infra

on:
  pull_request:
    paths: ["infra/terraform/**", "firestore.rules", ".github/workflows/infra.yml"]
  push:
    branches: [master]
    paths: ["infra/terraform/**", "firestore.rules", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

env:
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: infra/terraform

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0
      - run: tflint --init && tflint --recursive --config "$PWD/.tflint.hcl"

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.INFRA_ENABLED == 'true'
    needs: static
    runs-on: ubuntu-latest
    environment: infra-prd
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config=envs/prd.backend.hcl
      - name: Plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -var-file=envs/prd.tfvars -out=prd.tfplan | tee plan.txt
          {
            echo '### Terraform plan (prd)'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: terraform apply -input=false prd.tfplan
      - name: Sem diferenças após o apply (F02-RT-01)
        run: terraform plan -input=false -detailed-exitcode -var-file=envs/prd.tfvars
