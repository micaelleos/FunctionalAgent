name: deploy-api
description: >
  Cria uma revisão do Cloud Run por digest, sem tráfego, com uma tag própria; faz smoke test
  na URL da tag (/healthz com a versão esperada). Não move tráfego.
inputs:
  project:
    required: true
  region:
    required: true
  service:
    required: true
  image:
    description: Imagem por digest
    required: true
  tag:
    description: Tag da revisão (rc-<sha> ou pr-<n>)
    required: true
  expected-version:
    description: Versão que /healthz deve reportar (SHA do commit)
    required: true
outputs:
  revision:
    value: ${{ steps.deploy.outputs.revision }}
  tag-url:
    value: ${{ steps.deploy.outputs.tag_url }}
  service-url:
    value: ${{ steps.deploy.outputs.service_url }}
  previous-revision:
    description: Revisão que recebia 100% do tráfego antes deste deploy (alvo do rollback)
    value: ${{ steps.deploy.outputs.previous_revision }}
runs:
  using: composite
  steps:
    - id: deploy
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        REGION: ${{ inputs.region }}
        SERVICE: ${{ inputs.service }}
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        EXPECTED_VERSION: ${{ inputs.expected-version }}
      run: |
        set -euo pipefail
        describe() { gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json; }

        previous=$(describe | jq -r '[.status.traffic[] | select(.percent == 100)][0].revisionName // empty')
        echo "previous_revision=$previous" >> "$GITHUB_OUTPUT"

        gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
          --image "$IMAGE" --no-traffic --tag "$TAG" --quiet

        state=$(describe)
        revision=$(echo "$state" | jq -r '.status.latestCreatedRevisionName')
        tag_url=$(echo "$state" | jq -r --arg t "$TAG" '.status.traffic[] | select(.tag == $t) | .url')
        echo "revision=$revision" >> "$GITHUB_OUTPUT"
        echo "tag_url=$tag_url" >> "$GITHUB_OUTPUT"
        echo "service_url=$(echo "$state" | jq -r '.status.url')" >> "$GITHUB_OUTPUT"

        for i in $(seq 1 10); do
          if curl -fsS "$tag_url/healthz" | jq -e --arg v "$EXPECTED_VERSION" '.status == "ok" and .version == $v'; then
            echo "Smoke ok: $revision em $tag_url"; exit 0
          fi
          sleep 3
        done
        echo "::error::Smoke falhou: $tag_url/healthz não respondeu ok com a versão $EXPECTED_VERSION"
        exit 1
