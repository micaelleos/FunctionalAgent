name: deploy-web
description: Builda o SPA apontando para a API informada e publica no Firebase Hosting (site principal ou canal de preview).
inputs:
  project:
    required: true
  site:
    description: Site do Firebase Hosting (o mesmo de firebase.json)
    required: true
  api-base-url:
    required: true
  channel:
    description: Canal de preview (ex. pr-12). Vazio publica no site principal.
    required: false
    default: ""
outputs:
  url:
    description: URL publicada
    value: ${{ steps.deploy.outputs.url }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - shell: bash
      working-directory: frontend
      env:
        VITE_API_BASE_URL: ${{ inputs.api-base-url }}
      run: |
        npm ci
        npm run build
    - id: deploy
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        CHANNEL: ${{ inputs.channel }}
        SITE: ${{ inputs.site }}
        FIREBASE_TOOLS: firebase-tools@13.35.1
      run: |
        if [ -n "$CHANNEL" ]; then
          out=$(npx --yes "$FIREBASE_TOOLS" hosting:channel:deploy "$CHANNEL" \
            --project "$PROJECT" --expires 7d --json --non-interactive)
          url=$(echo "$out" | jq -r '.result | to_entries[0].value.url')
        else
          npx --yes "$FIREBASE_TOOLS" deploy --only hosting --project "$PROJECT" --non-interactive
          url="https://$SITE.web.app"
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "Frontend publicado: $url"
